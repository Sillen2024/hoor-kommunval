server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Astros egna byggfiler har innehållshash i filnamnet och kan cachas för evigt.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Övriga statiska filer (og-image.png, logotyper, favicon, käll-PDF:er) har
    # fasta filnamn och kan komma att bytas ut. De får därför en kort cachetid
    # utan immutable, så att en ny version slår igenom inom ett dygn i stället
    # för att sitta fast i en månad hos besökare och hos Facebooks scraper.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|pdf)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
